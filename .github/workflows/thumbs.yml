name: 商品縮圖（預先產生到自己的空間）
on:
  workflow_dispatch:
    inputs:
      full: { description: '全部重查內容填 1', default: '', required: false }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - env:
          SUPABASE_URL: https://oksutiyvzxgssmgppdbz.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FULL: ${{ inputs.full }}
        run: python3 tools/build_thumbs.py
