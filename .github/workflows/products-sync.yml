name: 同步商店商品（UNIQLO＋GU＋台灣品牌，測試用）
on:
  workflow_dispatch:
    inputs:
      per_cat: { description: '每個分類幾件', default: '12', required: false }
  schedule:
    - cron: '17 20 * * *'   # 每天台灣時間 04:17 更新價格與下架
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 抓商品並寫入 Supabase
        env:
          SUPABASE_URL: https://oksutiyvzxgssmgppdbz.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 tools/sync_uniqlo.py "${{ inputs.per_cat || '12' }}"
          BRAND=gu python3 tools/sync_uniqlo.py "${{ inputs.per_cat || '12' }}"
  tw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shop: [obdesign, giordano, vans, adidas, roots, edwin, timberland, levis, puma, thenorthface, underarmour, columbia, lativ, crocs, vacanza, pazzo, meierq, mercci22, 50-shop, lulus, fila, gap, gracegift, birkenstock, plain-me, daf-shoes, caco]
    steps:
      - uses: actions/checkout@v4
      - name: 台灣品牌（每家一台機器）
        env:
          SUPABASE_URL: https://oksutiyvzxgssmgppdbz.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONLY: ${{ matrix.shop }}
        run: python3 tools/sync_tw.py 12
