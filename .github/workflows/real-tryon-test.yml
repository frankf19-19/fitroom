name: 測試：真實生圖（會花 AI 費用）
on:
  workflow_dispatch:
    inputs:
      products: { description: '商品 id（逗號分隔）', default: '60', required: false }
jobs:
  t:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - env:
          SUPABASE_URL: https://oksutiyvzxgssmgppdbz.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PRODUCTS: ${{ inputs.products }}
        run: python3 qa/real_tryon_test.py
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b qa-real && git add -A
          git -c user.name=bot -c user.email=b@b commit -q -m real
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" qa-real
